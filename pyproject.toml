[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Autonomous AI research synthesis, Groq LLM intelligence, and daily briefing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "python-dotenv",
    "sqlalchemy",
    "requests",
    "beautifulsoup4",
    "feedparser",
    "youtube-transcript-api",
    "markdown",
    "pydantic",
    "fastapi",
    "uvicorn",
    "pymongo",
    "dnspython"
]

[tool.vercel]
entrypoint = "main:app"
