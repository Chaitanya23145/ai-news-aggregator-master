version: '3.8'

services:
  app:
    build: .
    container_name: ai-news-aggregator-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-ai_news_aggregator}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_news_aggregator}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - MY_EMAIL=${MY_EMAIL:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output

  postgres:
    image: postgres:17-alpine
    container_name: ai-news-aggregator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_news_aggregator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
