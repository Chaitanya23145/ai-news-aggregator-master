name: Daily AI Briefing Pipeline

on:
  schedule:
    # 8:00 AM IST is 2:30 AM UTC daily
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    name: Run Scrapers, Synthesize & Dispatch 8:00 AM Newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DB_TYPE: "mongodb"
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'ai_news_aggregator' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      MY_EMAIL: ${{ secrets.MY_EMAIL || 'coderchaitanyaupadhyay@gmail.com' }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      EMAIL_ENABLED: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Daily Pipeline
        run: |
          python main.py pipeline

